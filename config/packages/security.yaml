security:
  providers:
    app:
      entity:
        class: App\Entity\User
        property: id
  password_hashers:
    App\Entity\User:
      algorithm: auto
  firewalls:
    main:
      pattern: ^/
      lazy: true
      provider: app
      custom_authenticators:
        - App\Security\LoginFormAuthenticator
      entry_point: App\Security\LoginFormAuthenticator
      logout:
        path: app_logout
